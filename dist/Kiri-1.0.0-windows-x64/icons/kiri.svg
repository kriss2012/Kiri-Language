<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="stemLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="stemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="branchTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="branchBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#10b981" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Inner Soft Ring -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Faceted Crystal "K" -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Crystal Stem (Left Column) -->
    <!-- Top facet -->
    <polygon points="190,100 230,135 190,170 150,135" fill="#6ee7b7" stroke="#064e3b" stroke-width="2"/>
    <!-- Upper body left -->
    <polygon points="150,135 190,170 190,290 150,255" fill="url(#stemLeft)" stroke="#064e3b" stroke-width="2"/>
    <!-- Upper body right -->
    <polygon points="190,170 230,135 230,255 190,290" fill="url(#stemRight)" stroke="#064e3b" stroke-width="2"/>
    <!-- Lower body left -->
    <polygon points="150,255 190,290 190,375 150,340" fill="#059669" stroke="#064e3b" stroke-width="2"/>
    <!-- Lower body right -->
    <polygon points="190,290 230,255 230,340 190,375" fill="#10b981" stroke="#064e3b" stroke-width="2"/>
    <!-- Bottom facet point -->
    <polygon points="190,375 230,340 190,410 150,340" fill="#047857" stroke="#064e3b" stroke-width="2"/>

    <!-- Upper Diagonal Crystal Branch -->
    <polygon points="210,255 285,195 350,120 295,155" fill="#7dd3fc" stroke="#0c4a6e" stroke-width="2"/>
    <polygon points="285,195 375,175 350,120" fill="#38bdf8" stroke="#0c4a6e" stroke-width="2"/>
    <polygon points="210,255 315,240 375,175 285,195" fill="url(#branchTop)" stroke="#0c4a6e" stroke-width="2"/>

    <!-- Lower Diagonal Crystal Branch -->
    <polygon points="210,255 275,280 340,360 270,335" fill="url(#branchBottom)" stroke="#083344" stroke-width="2"/>
    <polygon points="275,280 375,325 340,360" fill="#0e7490" stroke="#083344" stroke-width="2"/>
    <polygon points="340,360 375,325 385,385 320,405" fill="#0284c7" stroke="#083344" stroke-width="2"/>
    <polygon points="210,255 300,270 375,325 275,280" fill="#22d3ee" stroke="#083344" stroke-width="2"/>
  </g>

  <!-- Typography: KIRI -->
  <text x="256" y="465" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="12" fill="#ffffff" text-anchor="middle">KIRI</text>
</svg>
